# Lab members
#
# photo: a square image in public/people/ (about 500×500 px). Leave it out to show a contour placeholder.
# links (all optional): site, email, scholar, github, linkedin, bluesky, x. Any other key fails the build.
# When someone graduates: set `group: alumni`, and add `end` and `now_at`.
#
# Example:
# - id: jane-doe                               # used in links: /people/#jane-doe
#   name: Jane Doe                             # must match the spelling in paper author lists
#   first: Jane                                # shown on the photo
#   group: core                                # faculty | core | alumni | visiting | pet (pets only take id, name, first, group, photo)
#   degree: PhD                                # postdoc | phd | ms | undergrad
#   position: Engineer@Company                 # OPTIONAL: company position or research program; e.g., AIRS
#   education: CS BS, University               # degree, university
#   photo: jane-doe.jpg
#   interests: Visual analytics, Knowledge graphs, Rock climbing
#   links:
#     site: https://janedoe.com
#     email: jdoe@stevens.edu
#     scholar: https://scholar.google.com/citations?user=...
#     github: https://github.com/janedoe
#     linkedin: https://www.linkedin.com/in/janedoe/
#     bluesky: https://bsky.app/profile/janedoe.bsky.social
#     x: https://x.com/janedoe
#   start: 2027
#   # end: 2032
#   # now_at: Company or University

