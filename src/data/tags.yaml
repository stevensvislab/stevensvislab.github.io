# Paper tags
# 
# The filters, pills, and About-page collaborators on the site are all built from this file.
#
# Groups:
#   domains   application areas (outlined #pills)
#   methods   methods and techniques (plain pills)
#   partners  collaborating organizations (logo + name on paper pages; cards on About). Logos go in public/logos/.
#
# Example: add a new tag, or add a paper slug to an existing tag's list.
#   domains:
#     healthcare:                        # key: lowercase-with-hyphens; shows up in filter URLs
#       label: Healthcare                # display name
#       papers: [ongoal, my-new-paper]   # paper slugs (file names in src/content/papers/)
#   partners:
#     nyu:
#       label: New York University
#       logo: nyu-logo.svg               # optional, file in public/logos/
#       papers: [my-new-paper]

# Application domains
domains:
