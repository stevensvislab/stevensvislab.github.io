# Lab culture playbook. Shown on the Join page (under "Lab culture") and on the Fun page (under the photos).
# Order here is display order. `paragraphs` and `notes[].text` support **bold**, *italic*, and [links](url).
#
# Example:
# - id: staying-the-course                     # lowercase-with-hyphens; used as the link anchor (#staying-the-course)
#   title: Staying the course
#   quote:
#     text: "All we have to decide is what to do with the time that is given us."
#     by: Gandalf
#     source: The Fellowship of the Ring
#   paragraphs:
#     - First paragraph.
#     - Second paragraph.
#   notes:                                     # optional: small titled subsections
#     - title: Group meetings
#       text: What happens there.

- id: research-is-an-adventure
  title: Research is an adventure
  quote:
    text: "It's a dangerous business, Frodo, going out of your door. You step into the Road, and if you don't keep your feet, there is no knowing where you might be swept off to!"
    by: Bilbo Baggins
    source: The Fellowship of the Ring
  paragraphs:
    - >-
      I see research as an adventure. You have a vague idea of a goal, a destination, something tangible, but you're not
      sure how you'll get there, and what challenges you'll face along the way. But you'll only get where you're going by
      taking that first step out the door.

- id: staying-the-course
  title: Staying the course
  quote:
    text: "All we have to decide is what to do with the time that is given us."
    by: Gandalf
    source: The Fellowship of the Ring
  paragraphs:
    - >-
      You have to trust in yourself and let go of what you cannot control. Comparison is the thief of joy. Making progress
      can mean a lot of things in research, from reading to writing to experimenting to thinking. Trust you are on the right
      path; your own.
    - >-
      New students start on a scoped first project with more hands-on support, then shape later projects around their own
      goals.

- id: being-part-of-the-fellowship
  title: Being a part of the fellowship
  quote:
    text: "I'm glad to be with you, Samwise Gamgee... here at the end of all things."
    by: Frodo Baggins
    source: The Return of the King
  paragraphs:
    - >-
      Research is a very social endeavor. Your best ideas will come from hanging out with interesting people. And when times
      are tough, it's your colleagues, peers, and friends who will stick by you, lift you up, and give you the strength to
      carry on.
  notes:
    - title: Group meetings
      text: We meet as a group to discuss papers, give feedback on drafts and proposals, and practice talks before conferences.
    - title: Outside the lab
      text: Lab outings, conference trips, and the occasional hike.
