name: Stevens Visualization Lab
shortName: VIS Lab @ Stevens
url: https://stevensvislab.github.io
email: acoscia@stevens.edu

# Google Search Console ownership tag (the `content` value of the google-site-verification meta tag).
# Leave it in place after verifying: Google re-checks it. Delete the line to remove the tag.
googleSiteVerification: 5HKZ4pkh6oxdUKqLcbqvNDKWgoqoe7NBDu0u9genSjg

# Supports **bold**, *italic*, and [links](url).
mission: >-
  Our mission is to help people **make sense of complex data**. We combine methods from
  visual analytics, AI, data science, and human-computer interaction to develop new
  interactive systems for **data visualization and analysis**.

# Set `show: false` to hide it. `text` supports **bold**, *italic*, and [links](url).
announcement:
  show: true
  text: "**We're recruiting PhD students for Fall 2027!** Master's, undergraduate, and visiting scholars are also welcome to join the expedition."
  link: /join/
  linkText: How to join

# Supports **bold**, *italic*, and [links](url).
whatWeDo:
  - >-
    Data is everywhere, and people need help making sense of it now more than ever!
  - >-
    We have developed interactive systems for visualizing text documents, tabular data, and knowledge graphs, tackling
    hard problems in sensemaking, human-AI collaboration, and AI trustworthiness, with applications across education,
    intelligence analysis, data science, interactive machine learning, human-robot interaction, ocean science,
    healthcare, and creativity.
  - >-
    We are highly interdisciplinary! We demonstrate impact by engaging in iterative co-design and longitudinal field
    deployments with real domain experts. Our work contributes open-source software, empirical studies, and design
    guidelines to visualization, HCI, and AI communities.

# `text` supports **bold**, *italic*, and [links](url).
values:
  - title: Research is an adventure
    text: >-
      You have a vague idea of a goal, but you're not sure how you'll get there or what challenges you'll face along
      the way. You only get where you're going by taking that first step out the door.
  - title: Build with the people who use it
    text: >-
      We demonstrate impact by engaging in iterative co-design and longitudinal field deployments with real domain
      experts.
  - title: Trust your own path
    text: >-
      Comparison is the thief of joy. Making progress can mean a lot of things in research, from reading to writing to
      experimenting to thinking.
  - title: Research is social
    text: >-
      Your best ideas will come from hanging out with interesting people. When times are tough, your colleagues, peers,
      and friends will lift you up.
  - title: Share what we learn
    text: >-
      Our work contributes open-source software, empirical studies, and design guidelines to visualization, HCI, and AI
      communities.

